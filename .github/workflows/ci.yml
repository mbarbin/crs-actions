name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Lint shell scripts with shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          find . -type f -name '*.sh' -exec shellcheck --shell=sh --format=tty {} +

      - name: Test local test script (archive)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./setup-crs/test-install.sh \
            0.0.20260307 \
            sha256:5097e709386d8d41351a87f86c8ad374db72aabe4ddc2a8ff2d58faebb1b889f

      - name: Test local test script (raw binary fallback)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./setup-crs/test-install.sh \
            0.0.20251014 \
            sha256:82ac2264a2b6bd6e3dc47b1ff273eebc2682efe3ad255b14eab9b001b9c1eee6
