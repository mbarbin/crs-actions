name: "setup-crs"
description: "Download and set up the crs code review tool executable from a GitHub release."
author: "crs contributors"
inputs:
  crs-version:
    description: "crs version to install."
    required: true
  crs-digest:
    description: "Expected digest of the binary for integrity verification (e.g., sha256:abc123...). The action will fail if the downloaded binary does not match."
    required: true
runs:
  using: "composite"
  steps:
    - name: Install crs
      shell: sh
      run: |
        "${{ github.action_path }}/install.sh"
      env:
        CRS_VERSION: ${{ inputs.crs-version }}
        CRS_DIGEST: ${{ inputs.crs-digest }}
        GH_TOKEN: ${{ github.token }}
branding:
  icon: "terminal"
  color: "blue"
